name: AI Battle Phase 1C Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

jobs:
  headless-regression:
    name: Eight by thirty-two headless playouts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run 256-game deterministic regression
        env:
          AI_BATTLE_PHASE_ONE_C_ARTIFACT_DIR: artifacts/ai-battle-phase-one-c
        run: pnpm test:ai-battle:phase-one-c

      - name: Upload failure replay tapes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-battle-phase-one-c-failure-tapes
          path: artifacts/ai-battle-phase-one-c
          if-no-files-found: ignore
          retention-days: 30
