services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loveca
      POSTGRES_USER: ${POSTGRES_USER:-loveca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-loveca} -d loveca']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${LOVECA_API_IMAGE:-ghcr.io/catmeow123456/loveca-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3007
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-loveca}:${POSTGRES_PASSWORD}@postgres:5432/loveca
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      AI_EFFECT_EXTRACTION_ENCRYPTION_KEY: ${AI_EFFECT_EXTRACTION_ENCRYPTION_KEY:-}
      AI_EFFECT_EXTRACTION_ALLOWED_HOSTS: ${AI_EFFECT_EXTRACTION_ALLOWED_HOSTS:-dashscope.aliyuncs.com}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-loveca-cards}
      MINIO_WALLPAPER_BUCKET: ${MINIO_WALLPAPER_BUCKET:-loveca-user-assets}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      PLAYER_WALLPAPER_PROCESSING_CONCURRENCY: ${PLAYER_WALLPAPER_PROCESSING_CONCURRENCY:-2}
      PLAYER_WALLPAPER_PROCESSING_TIMEOUT_SECONDS: ${PLAYER_WALLPAPER_PROCESSING_TIMEOUT_SECONDS:-15}
      PLAYER_WALLPAPER_RETIRED_RETENTION_HOURS: ${PLAYER_WALLPAPER_RETIRED_RETENTION_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@loveca.app}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      PUBLIC_SITE_STATUS_SNAPSHOT_PATH: /var/lib/loveca/site-status/site-status.json
    volumes:
      - ${PUBLIC_SITE_STATUS_SNAPSHOT_DIR:-./runtime/site-status}:/var/lib/loveca/site-status
    ports:
      - '127.0.0.1:3007:3007'

volumes:
  pgdata:
