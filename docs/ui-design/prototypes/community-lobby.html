<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>对战大厅 · Loveca 交互原型</title>
    <style>
      /* Standalone design attachment. Tokens follow product-visual-system.md. */
      :root {
        color-scheme: dark;
        --canvas: #1d1321;
        --surface: #281629;
        --subtle: #301a30;
        --strong: #35192f;
        --text: #fffdf9;
        --secondary: #c9bec8;
        --muted: #b0a1b0;
        --border: rgb(255 253 249 / 18%);
        --control-border: #8b788d;
        --hairline: rgb(255 253 249 / 10%);
        --coral: #e95678;
        --coral-hover: #f06b89;
        --ink: #1d1321;
        --ready: #6fcbd0;
        --ready-bg: #203439;
        --focus: #f298b0;
        --font: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --mono: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
      }
      [data-theme='light'] {
        color-scheme: light;
        --canvas: #f8f3ed;
        --surface: #fffdf9;
        --subtle: #f1e9e5;
        --strong: #e9deda;
        --text: #1d1321;
        --secondary: #655865;
        --muted: #716471;
        --border: rgb(29 19 33 / 22%);
        --control-border: #897887;
        --hairline: rgb(29 19 33 / 12%);
        --coral-hover: #ef6c89;
        --ready: #246169;
        --ready-bg: #e0f0ef;
        --focus: #a62c50;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font: 400 0.9375rem/1.65 var(--font);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-weight: 400;
      }
      body:has(dialog[open]) {
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      select,
      summary {
        cursor: pointer;
      }
      button {
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 16px;
        background: var(--surface);
        font-weight: 600;
        line-height: 1.45;
      }
      button:hover {
        background: var(--subtle);
        border-color: var(--secondary);
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      button.primary {
        background: var(--coral);
        color: var(--ink);
        border-color: transparent;
      }
      button.primary:hover {
        background: var(--coral-hover);
      }
      button.quiet {
        background: transparent;
        border-color: transparent;
      }
      button.quiet:hover {
        background: var(--subtle);
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      [tabindex='-1']:focus {
        outline: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.3;
        font-weight: 600;
      }
      h2 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      h3 {
        font-size: 1.0625rem;
        font-weight: 600;
      }
      small,
      .small {
        font-size: 0.8125rem;
      }
      .muted {
        color: var(--secondary);
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      .wrap {
        max-width: 1168px;
        margin: auto;
        padding-inline: 24px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .review {
        border-bottom: 1px dashed var(--border);
        background: var(--subtle);
      }
      .review summary {
        min-height: 44px;
        padding-block: 10px;
        color: var(--secondary);
        font-size: 0.8125rem;
      }
      .review summary span {
        margin-left: 12px;
      }
      .review-body {
        padding: 8px 0 20px;
        display: grid;
        gap: 12px;
      }
      .review-body label {
        display: grid;
        gap: 4px;
        flex: 1 1 210px;
      }
      .review-body button {
        align-self: end;
      }
      .review-links a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
      .topbar {
        border-bottom: 1px solid var(--hairline);
      }
      .topbar .wrap {
        min-height: 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.1875rem;
        font-weight: 600;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
        border: 2px solid var(--coral);
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: var(--coral);
        font-size: 1rem;
        transform: rotate(-8deg);
      }
      .account {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--secondary);
      }
      .account-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ready);
      }
      main {
        padding-block: 20px 48px;
      }
      .page-heading {
        min-height: 72px;
        margin-bottom: 16px;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .current {
        padding: 20px 24px;
        border-top: 3px solid var(--coral);
        margin-bottom: 32px;
      }
      .section-label {
        font-size: 0.8125rem;
        color: var(--secondary);
        margin-bottom: 12px;
      }
      .current-body {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: center;
        flex-wrap: wrap;
      }
      .current-copy {
        flex: 1 1 320px;
        min-width: 0;
      }
      .current-copy p {
        color: var(--secondary);
        margin-top: 4px;
      }
      .current-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .deck-thumb {
        width: 34px;
        height: 46px;
        background: var(--strong);
        border: 1px solid var(--border);
        border-radius: 4px;
        display: grid;
        place-items: center;
        font-weight: 600;
        color: var(--secondary);
        flex-shrink: 0;
      }
      .deck-line {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .badge {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 0.75rem;
        white-space: nowrap;
      }
      .badge.ready {
        color: var(--ready);
        border-color: transparent;
        background: var(--ready-bg);
      }
      .badge.ready::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .paired-players {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .paired-players > span {
        padding: 8px 12px;
        border: 1px solid var(--hairline);
        border-radius: 8px;
      }
      .paired-players small {
        display: block;
        color: var(--secondary);
      }
      .deadline {
        font-family: var(--mono);
        font-size: 1.625rem;
        line-height: 1.25;
      }
      .list-heading {
        margin-bottom: 16px;
      }
      .counts {
        color: var(--secondary);
        font-size: 0.8125rem;
      }
      .toolbar {
        padding: 16px 20px;
        border-bottom: 1px solid var(--hairline);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .filter-group {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .filter-group button {
        padding-inline: 12px;
        background: transparent;
        border-color: transparent;
        color: var(--secondary);
      }
      .filter-group button[aria-pressed='true'] {
        color: var(--text);
        border-color: var(--border);
        background: var(--strong);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        cursor: pointer;
      }
      input[type='checkbox'],
      input[type='radio'] {
        width: 18px;
        height: 18px;
        accent-color: var(--coral);
        flex-shrink: 0;
      }
      input:not([type='checkbox']):not([type='radio']),
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--control-border);
        border-radius: 8px;
        background: var(--canvas);
        padding: 9px 12px;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      .search {
        flex: 1 1 200px;
        max-width: 240px;
      }
      .table-head,
      .room-row {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) 130px 85px 160px 104px;
        gap: 16px;
        align-items: center;
        padding: 12px 20px;
      }
      .table-head {
        font-size: 0.75rem;
        color: var(--secondary);
        background: var(--subtle);
        border-bottom: 1px solid var(--hairline);
      }
      .room-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .room-row {
        min-height: 98px;
        border-bottom: 1px solid var(--hairline);
      }
      .room-row:last-child {
        border-bottom: 0;
      }
      .room-row:hover {
        background: var(--subtle);
      }
      .room-row > * {
        min-width: 0;
      }
      .room-identity {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--strong);
        color: var(--secondary);
        border: 1px solid var(--border);
        font-size: 0.8125rem;
        flex-shrink: 0;
      }
      .names {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .versus {
        color: var(--secondary);
        font-size: 0.75rem;
        margin-inline: 6px;
        font-weight: 400;
      }
      .room-note,
      .room-code {
        color: var(--secondary);
        font-size: 0.75rem;
        overflow-wrap: anywhere;
      }
      .room-note {
        margin-top: 4px;
      }
      .status-cell .small {
        display: block;
        margin-top: 4px;
        color: var(--secondary);
      }
      .room-meta {
        color: var(--secondary);
        font-size: 0.8125rem;
      }
      .room-meta span {
        display: block;
      }
      .spectator-cell {
        font-size: 0.8125rem;
      }
      .spectator-cell small {
        color: var(--secondary);
        display: block;
      }
      .room-action {
        text-align: right;
        font-size: 0.75rem;
        color: var(--secondary);
      }
      .room-action button {
        width: 100%;
        padding-inline: 10px;
      }
      .list-footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 20px;
        border-top: 1px solid var(--hairline);
        color: var(--secondary);
        font-size: 0.75rem;
      }
      .empty {
        padding: 48px 24px;
        text-align: center;
      }
      .empty p {
        margin: 8px 0 16px;
        color: var(--secondary);
      }
      .notice {
        padding: 12px 16px;
        background: var(--subtle);
        border-left: 3px solid var(--coral);
        margin: 12px 0;
        border-radius: 0 8px 8px 0;
      }
      #listNotice {
        margin: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
      }
      #pendingNotice {
        margin-bottom: 12px;
      }
      footer.page-footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
        color: var(--secondary);
        font-size: 0.75rem;
      }
      dialog {
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0;
        width: 560px;
        max-width: calc(100% - 32px);
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
      }
      dialog::backdrop {
        background: rgb(14 8 17 / 72%);
      }
      .modal-header {
        padding: 20px 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .modal-header button {
        width: 44px;
        padding: 8px;
        font-size: 1.25rem;
        flex-shrink: 0;
      }
      .modal-body {
        padding: 16px 24px 24px;
      }
      .modal-body > p {
        color: var(--secondary);
        margin-bottom: 16px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      legend,
      .field-label {
        font-weight: 600;
        margin-bottom: 8px;
        display: block;
      }
      .field-label small {
        color: var(--secondary);
        font-weight: 400;
      }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .choice {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        min-width: 0;
      }
      .choice:has(input:checked) {
        border-color: var(--coral);
        background: var(--subtle);
      }
      .choice input {
        margin: 3px 0 0;
      }
      .choice strong {
        font-weight: 600;
        display: block;
      }
      .choice small {
        display: block;
        color: var(--secondary);
        margin-top: 4px;
      }
      .field-help {
        color: var(--secondary);
        font-size: 0.8125rem;
        margin-top: 8px;
      }
      .deck-choices {
        display: grid;
        gap: 8px;
      }
      .deck-choices .choice {
        align-items: center;
      }
      .deck-choices .choice input {
        margin-top: 0;
      }
      .deck-choices .choice span:last-child {
        flex: 1;
      }
      #dialogError {
        margin-bottom: 16px;
      }
      .share-box {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .share-box input {
        flex: 1 1 220px;
        min-width: 0;
      }
      .preview {
        padding: 16px;
        background: var(--subtle);
        border-radius: 8px;
        margin-top: 16px;
      }
      .preview p {
        color: var(--secondary);
        margin-top: 4px;
      }
      .preview button {
        margin-top: 12px;
      }
      @media (max-width: 1000px) {
        .table-head,
        .room-row {
          grid-template-columns: minmax(180px, 1fr) 110px 70px 130px 96px;
          gap: 12px;
          padding-inline: 16px;
        }
        .toolbar {
          padding-inline: 16px;
        }
      }
      @media (max-width: 768px) {
        .wrap {
          padding-inline: 16px;
        }
        .topbar .wrap {
          min-height: 64px;
        }
        .topbar .home-label {
          padding-inline: 8px;
        }
        .topbar .wrap > .row {
          gap: 4px;
        }
        .topbar .home-prefix {
          display: none;
        }
        .brand {
          gap: 8px;
          font-size: 1.0625rem;
        }
        .account {
          font-size: 0.8125rem;
        }
        h1 {
          font-size: 1.625rem;
        }
        .page-heading {
          gap: 12px;
          margin-bottom: 16px;
        }
        .page-heading > .row {
          gap: 8px;
        }
        .page-heading button {
          padding-inline: 12px;
        }
        .current {
          padding: 16px;
          margin-bottom: 24px;
        }
        .current-body {
          gap: 16px;
        }
        .current-copy {
          flex-basis: 100%;
        }
        .current-actions {
          width: 100%;
        }
        .current-actions .primary {
          flex: 1;
        }
        .table-head {
          display: none;
        }
        .room-row {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 8px 12px;
          padding: 16px;
        }
        .room-identity {
          grid-column: 1;
          grid-row: 1;
        }
        .status-cell {
          grid-column: 2;
          grid-row: 1;
          justify-self: end;
        }
        .room-meta {
          grid-column: 1;
          grid-row: 2;
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }
        .spectator-cell {
          grid-column: 1;
          grid-row: 3;
        }
        .spectator-cell.empty-time {
          display: none;
        }
        .spectator-cell small {
          display: inline;
          margin-left: 8px;
        }
        .room-action {
          grid-column: 2;
          grid-row: 2 / 4;
          align-self: end;
          max-width: 104px;
        }
        .room-action button {
          width: auto;
          min-width: 88px;
        }
        .toolbar {
          align-items: stretch;
          gap: 8px;
        }
        .toolbar > .row {
          width: 100%;
          justify-content: space-between;
          gap: 0;
        }
        .filter-group button {
          padding-inline: 10px;
        }
        .search {
          max-width: none;
          flex-basis: 100%;
        }
        .list-heading {
          align-items: flex-start;
          gap: 4px;
        }
        .list-heading h2 {
          font-size: 1.125rem;
        }
        .counts {
          width: 100%;
        }
        dialog {
          max-width: calc(100% - 16px);
          max-height: calc(100dvh - 16px);
          margin: auto auto 8px;
          width: 560px;
        }
        .modal-header {
          padding: 16px 16px 0;
        }
        .modal-body {
          padding: 16px;
        }
        .modal-actions > button {
          flex: 1;
        }
        .choices {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 360px) {
        .wrap {
          padding-inline: 12px;
        }
        .account-dot {
          display: none;
        }
        .topbar .row {
          gap: 4px;
        }
        .topbar button {
          padding-inline: 8px;
        }
        .filter-group button {
          padding-inline: 8px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition:
            background-color 120ms ease,
            border-color 120ms ease;
        }
      }
    </style>
  </head>
  <body>
    <a class="sr-only" href="#main" id="skip">跳到大厅内容</a>
    <style>
      #skip:focus {
        position: fixed;
        top: 8px;
        left: 8px;
        width: auto;
        height: auto;
        clip-path: none;
        margin: 0;
        padding: 12px;
        background: var(--surface);
        z-index: 10;
      }
    </style>
    <aside class="review" aria-label="原型评审工具">
      <details class="wrap" id="reviewTools">
        <summary>交互原型 · 本地示例数据 <span>展开评审工具</span></summary>
        <div class="review-body">
          <p class="small muted">
            所有房间、卡组和操作均为内存演示；刷新重置。此工具条不属于产品界面。
          </p>
          <div class="row">
            <label class="small"
              >预设场景
              <select id="scenario">
                <option value="mixed">大厅 · 混合状态</option>
                <option value="empty">没有公开房间</option>
                <option value="loadError">首次加载失败</option>
                <option value="stale">刷新失败 · 保留旧数据</option>
                <option value="noDecks">没有合法卡组</option>
                <option value="waiting">本人公开等人</option>
                <option value="paired">配对待确认</option>
                <option value="ended">休闲赛后</option>
                <option value="ranked">已有排位占用</option>
                <option value="lost">运行态无法恢复</option>
              </select>
            </label>
            <label class="small"
              >模拟事件
              <select id="event">
                <option value="pair">对手加入我的空房</option>
                <option value="otherConfirm">对手确认开局</option>
                <option value="timeout">确认期限到达</option>
                <option value="opponentCancel">对手取消配对</option>
                <option value="race">下一次加入被抢先占座</option>
                <option value="revoke">撤销海月的观战授权</option>
                <option value="newRoom">出现一个新公开房间</option>
                <option value="refreshFail">后台刷新失败</option>
                <option value="end">本局结束</option>
                <option value="leave">赛后对手离开</option>
                <option value="rematch">对手请求／同意再战</option>
                <option value="bootstrapFail">下一次开局引导失败</option>
              </select>
            </label>
            <button type="button" id="runEvent">执行事件</button>

    <script>
      'use strict';
      // No fetch, account storage, API clients or external assets: this is an isolated mock.
      const $ = (s) => document.querySelector(s);
      const esc = (v) =>
        String(v ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]

      const button = (action, label, primary = false, extra = '') =>
        `<button type="button" data-action="${action}" ${primary ? 'class="primary"' : ''} ${extra}>${label}</button>`;
      const decks = [
        { id: 'liella', name: 'Liella! 练习组', mark: 'L' },

      ];
      const modal = $('#modal');
      let rooms,

        preferredDeck = 'liella',
        hasDecks = true,

        readState = 'ready',
        lastRead;
      let pending = [],
        context = null,
        returnFocus = null,
        raceNext = false,
        failBootstrap = false,
        serial = 0,
        epoch = 0;
      let bootstrapTimer, announcementTimer;
      const seed = () => {
        const t = Date.now();

          {
            id: 'M7K2PF',
            players: ['凉音'],

      const getRoom = (id) => rooms.find((r) => r.id === id);

      function review(message) {

      function makeOwn(isPublic = true, start = Date.now(), note = '') {
        const id = `V${String(++serial).padStart(4, '0')}K`;

          mode: '休闲',

          views: [],

          allowView: false,
          round: ++epoch,

      }
      function renderCurrent() {
        let content;

        const actions = (html) => `<div class="current-actions">${html}</div>`;
        const copy = (title, body, extra = '') =>

        if (!own) {
          content =
            copy(
              '下一局，和谁一起？',
              hasDecks
                ? '选一副卡组，找对手或加入下面的房间。'
                : '还没有合法卡组。你仍可浏览房间和观战。',
              hasDecks
                ? `<div class="deck-line"><span class="deck-thumb" aria-hidden="true">${esc(decks.find((d) => d.id === preferredDeck).mark)}</span><span><strong>${esc(deckName())}</strong><br><small class="muted">最近使用 · 合法</small></span>${button('deck', '换组')}</div>`

          content =
            copy('你正在参加排位', '当前真人席位已占用。可以继续浏览和观战。') +
            actions(button('room', '返回排位', true));
        } else if (own.state === 'lost') {
          content =
            copy('这局暂时无法恢复', '房间 V0001K 的对局运行态缺失；当前占用需核验后处理。') +
            actions(button('recover', '重新核验', true));
        } else if (own.state === 'waiting') {
          content =
            copy(
              r.public ? '正在等一位对手' : '等待通过链接加入',
              `${r.public ? '公开找人 · ' : '不会出现在公开列表 · '}房间 <span class="mono">${r.id}</span> · 已等待 <span data-elapsed="${own.waitingSince}" class="mono">${elapsed(own.waitingSince)}</span>`,
              `<div class="deck-line"><span class="badge ready">等待加入</span><span class="small muted">${esc(deckName())}</span>${button('deck', '换组')}</div>`
            ) +
            actions(
              button('room', '查看房间', true) +
                button('share', '分享') +
                button('cancel', '取消等待')
            );
        } else if (own.state === 'paired') {
          const opponent = r.players.find((p) => p !== '小凛');
          content =
            copy(
              own.confirmed ? '已确认，等待对手' : '找到对手，请确认开局',
              `房间 <span class="mono">${r.id}</span> · 本局使用「${esc(deckName())}」`,
              `<div class="paired-players"><span>小凛<small>${own.confirmed ? '✓ 已确认' : '待确认'}</small></span><span aria-hidden="true">vs</span><span>${esc(opponent)}<small>${own.otherConfirmed ? '✓ 已确认' : '待确认'}</small></span><div><span class="deadline" id="countdown">${Math.max(0, Math.ceil((own.deadline - Date.now()) / 1000))}</span><small class="muted"> 秒内确认</small></div></div>`
            ) +
            actions(
              (own.confirmed
                ? '<span class="badge ready">你已确认</span>'
                : button('confirm', '确认开局', true)) + button('cancel', '取消配对')
            );
        } else if (own.state === 'boot') {
          content =
            copy('正在准备开局…', '双方已确认，正在进入房间。') +
            actions('<span class="badge">开局中</span>');
        } else if (own.state === 'bootError') {
          content =
            copy('暂时未能开局', '双方确认已保留，尚未进入对局。请重试；达到上限会结束本轮准备。') +
            actions(button('retryBoot', '重试开局', true));
        } else if (own.state === 'live') {
          content =
            copy(
              '你的对局正在进行',
              `${esc(r.players.join(' · '))} · 房间 <span class="mono">${r.id}</span>`
            ) + actions(button('room', '返回房间', true));
        } else if (own.state === 'ended') {
          const msg = own.opponentLeft
            ? '对手已离开。你可以主动继续公开找人。'
            : own.rematch === 'sent'
              ? '已请求再来一局，等待对手同意。'
              : own.rematch === 'received'
                ? '对手想再来一局，是否继续？'
                : '本局已结束。双方同意后重新选组和确认。';
          content =
            copy('本局已结束', msg) +
            actions(
              (own.opponentLeft
                ? button('continue', '继续公开找人', true)
                : own.rematch === 'sent'
                  ? button('withdrawRematch', '撤回再战请求')
                  : button('rematch', own.rematch === 'received' ? '同意再战' : '再来一局', true)) +
                button('leave', '离开房间')
            );
        }
        $('#current').innerHTML =
          '<div class="section-label" id="currentLabel">我的当前状态</div><div class="current-body">' +
          content +
          '</div>';
      }
      function stateName(r) {
        return {
          waiting: '等待加入',
          paired: '双方准备',
          boot: '正在开局',
          bootError: '开局待重试',
          live: '对战中',
          ended: '已结束',
        }[r.state];
      }
      function rowHTML(r) {
        const mine = own?.roomId === r.id;
        const names = r.players.map(esc).join('<span class="versus">vs</span>');
        const action = mine
          ? button('room', '返回房间', false, `data-room="${r.id}"`)
          : r.state === 'waiting'
            ? button(
                'join',
                '加入房间',
                false,
                `data-room="${r.id}" aria-label="加入 ${esc(r.players[0])} 的房间"`
              )
            : r.state === 'live' && r.views.length
              ? button(
                  'spectate',
                  '观战',
                  false,
                  `data-room="${r.id}" aria-label="观战 ${esc(r.players.join('与'))} 的对局"`
                )
              : r.state === 'live'
                ? '未开放观战'
                : r.state === 'ended'
                  ? '等待赛后操作'
                  : '双方准备中';
        return `<li class="room-row" data-room-id="${r.id}"><div class="room-identity"><span class="avatar" aria-hidden="true">${esc(r.players[0].slice(0, 1))}</span><div><div class="names">${names}${mine ? ' <span class="badge">我的房间</span>' : ''}</div><div class="room-code mono">${r.id}</div>${r.note ? `<p class="room-note">${esc(r.note)}</p>` : ''}</div></div><div class="status-cell"><span class="badge ${r.state === 'waiting' ? 'ready' : ''}">${stateName(r)}</span></div><div class="room-meta"><span>${r.players.length}/2</span><span>${esc(r.mode)}</span></div><div class="spectator-cell ${['waiting', 'live'].includes(r.state) ? '' : 'empty-time'}">${r.state === 'waiting' ? '已等 ' : r.state === 'live' ? '已进行 ' : ''}${['waiting', 'live'].includes(r.state) ? `<span class="mono" data-elapsed="${r.since}">${elapsed(r.since)}</span>` : '—'}${r.state === 'live' && r.views.length ? `<small>${r.views.length} 个视角开放</small>` : ''}</div><div class="room-action">${action}</div></li>`;
      }
      function renderList() {
        const order = { waiting: 0, paired: 1, boot: 1, bootError: 1, live: 2, ended: 3 };
        const visible = rooms
          .filter((r) => r.public)
          .sort(
            (a, b) =>
              order[a.state] - order[b.state] || a.since - b.since || a.id.localeCompare(b.id)
          );
        $('#counts').textContent =
          readState === 'error'
            ? '暂时无法获取房间数量'
            : `${visible.filter((r) => r.state === 'waiting').length} 间等待 · ${visible.filter((r) => r.state === 'paired' || r.state === 'boot' || r.state === 'bootError').length} 间准备 · ${visible.filter((r) => r.state === 'live').length} 间对战`;
        document
          .querySelectorAll('[data-filter]')
          .forEach((el) => el.setAttribute('aria-pressed', String(el.dataset.filter === filter)));
        const term = $('#search').value.trim().toLowerCase();
        const matches = visible.filter(
          (r) =>
            (filter === 'all' || r.state === filter) &&
            (!$('#spectatable').checked || (r.state === 'live' && r.views.length)) &&
            (!term ||
              r.id.toLowerCase().includes(term) ||
              r.players.some((p) => p.toLowerCase().includes(term)))
        );
        $('#rooms').innerHTML = readState === 'error' ? '' : matches.map(rowHTML).join('');
        $('#empty').hidden = readState !== 'error' && matches.length > 0;
        $('#empty').innerHTML =
          readState === 'error'
            ? '<h3>房间列表加载失败</h3><p>无法获取房间状态，请检查网络后重试。</p>' +
              button('refresh', '重试加载')
            : visible.length
              ? '<h3>没有符合条件的房间</h3><p>试试其他昵称，或清除筛选。</p>' +
                button('clearFilters', '清除筛选')

                button('find', '找对手');

            ? '尚未取得有效列表'

      function focusCurrent() {

      function show(title, html, nextContext = null) {
        if (!modal.open) returnFocus = document.activeElement;

      function close() {

          ...modal.querySelectorAll(
            'button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), a[href]'
          ),

          last = controls.at(-1),
          active = document.activeElement;

          event.preventDefault();
          last?.focus();

          event.preventDefault();
          first?.focus();
        }

          flow === 'find'

          show(
            '无法恢复这局对战',
            '<p>演示核验结果：运行态已确认丢失。本轮无法继续，按现有终局政策处理后释放失效占用，不会重建一局冒充恢复。</p><div class="modal-actions">' +
              button('releaseLost', '处理失效占用', true) +
              '</div>'
          );
        if (a === 'releaseLost' && own?.state === 'lost') {
          own = null;
          ++epoch;
          render();
          close();
          focusCurrent();
          announce('失效占用已处理，可重新参与。');
        }
        if (a === 'manageDecks')
          show(
            '管理卡组入口',
            '<p>正式产品将在这里进入已有卡组管理。本原型不会创建、保存或导入账号卡组；可在评审工具切回正常场景继续体验。</p>' +
              button('close', '返回大厅')
          );
        if (a === 'home')
          show(
            '返回首页',
            '<p>正式产品将返回首页；有效等待会保留，并在全局当前状态中提示。</p>' +
              button('close', '返回对战大厅')
          );
      });
      document.addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.target;
        if (form.id === 'participateForm') submitParticipation(form);
        if (form.id === 'codeForm') lookup(new FormData(form).get('code'));
        if (form.id === 'spectateForm')
          enterSpectate(context.roomId, new FormData(form).get('view'));
        if (form.id === 'deckForm') {
          if (own?.round !== context.round)
            return error('当前配对已变化，请关闭弹层查看当前任务。');
          preferredDeck = new FormData(form).get('deck');
          if (own) own.deck = preferredDeck;
          renderCurrent();
          close();
          announce('卡组已更换。');
        }
        if (form.id === 'rematchForm' && own?.state === 'ended' && !own.opponentLeft) {
          preferredDeck = new FormData(form).get('deck');
          own.deck = preferredDeck;
          if (own.rematch === 'received') beginRematch();
          else {
            own.rematch = 'sent';
            render();
            close();
            focusCurrent();
            announce('再战请求已发送，等待对手同意。');
          }
        }
      });
      document.addEventListener('change', (event) => {
        if (event.target.name === 'deck') {
          preferredDeck = event.target.value;
          if (!own) renderCurrent();
        }
        if (event.target.name === 'allowView' && context?.flow === 'room' && own) {
          own.allowView = event.target.checked;
          if (own.state === 'live') myRoom().views = own.allowView ? ['小凛'] : [];
          renderList();
          announce(own.allowView ? '你的视角已开放。' : '你的视角已关闭。');
        }
      });
      $('#search').addEventListener('input', () => {
        renderList();
        announce($('#updated').textContent);
      });
      $('#spectatable').addEventListener('change', () => {
        renderList();
        announce($('#updated').textContent);
      });
      $('#scenario').addEventListener('change', (e) => reset(e.target.value));
      $('#reset').addEventListener('click', () => reset());
      $('#runEvent').addEventListener('click', () => runEvent($('#event').value));
      $('#theme').addEventListener('click', () => {
        const light = document.documentElement.dataset.theme !== 'light';
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        $('#theme').textContent = light ? '深色' : '浅色';
        $('#theme').setAttribute('aria-label', `切换到${light ? '深' : '浅'}色主题`);
      });
      // Only text updates tick. No list replacement, focus movement or per-second live announcements.
      setInterval(() => {
        document.querySelectorAll('[data-elapsed]').forEach((el) => {
          el.textContent = elapsed(Number(el.dataset.elapsed));
        });
        if (own?.state === 'paired') {
          const seconds = Math.max(0, Math.ceil((own.deadline - Date.now()) / 1000));
          const node = $('#countdown');
          if (node) node.textContent = seconds;
          if (seconds === 10 && !own.warned) {
            own.warned = true;
            announce('确认还剩 10 秒。');
          }
          if (seconds === 0) cancelOrTimeout(true);
        }
      }, 1000);
      reset();
      const incoming = new URLSearchParams(location.search).get('room');
      if (incoming) {
        showCode();
        $('#roomCode').value = incoming;
        lookup(incoming);
      }
    </script>
  </body>
</html>
