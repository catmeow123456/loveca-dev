# Loveca Nginx 配置
# 将此文件复制到 /etc/nginx/sites-available/loveca.conf
# 然后创建软链接: ln -s /etc/nginx/sites-available/loveca.conf /etc/nginx/sites-enabled/
# 最后重载 nginx: sudo nginx -s reload

# 此文件由 nginx.conf 的 http 块 include；map / log_format 必须位于 server 块外。
# 只采样启动请求，不记录查询串、Cookie、Authorization 或请求/响应正文。
map "$request_method:$uri:$arg_status" $loveca_startup_diagnostic {
    default 0;
    "GET:/api/cards/published:" 1;
    "GET:/api/cards:PUBLISHED" 1;
    "GET:/api/config:" 1;
    "GET:/site-status.json:" 1;
    "POST:/api/auth/refresh:" 1;
}

log_format loveca_startup_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","protocol":"$server_protocol",'
    '"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"request_completion":"$request_completion","request_id":"$request_id",'
    '"upstream_request_id":"$upstream_http_x_request_id",'
    '"upstream_status":"$upstream_status","upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time","upstream_response_time":"$upstream_response_time",'
    '"upstream_response_length":"$upstream_response_length",'
    '"accept_encoding":"$http_accept_encoding","content_encoding":"$sent_http_content_encoding",'
    '"gzip_ratio":"$gzip_ratio","connection":"$connection",'
    '"connection_requests":$connection_requests,"user_agent":"$http_user_agent"}';

# HTTP - 重定向到 HTTPS
server {
    listen 80;
    server_name loveca.lovelivefun.xyz;
    
    # 301 永久重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name loveca.lovelivefun.xyz;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/lovelivefun.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lovelivefun.xyz/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (可选，启用后浏览器会强制使用 HTTPS)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 访问日志
    access_log /var/log/nginx/loveca.access.log;
    access_log /var/log/nginx/loveca.startup-diagnostic.log loveca_startup_json if=$loveca_startup_diagnostic;
    error_log /var/log/nginx/loveca.error.log;

    location / {
        proxy_pass http://localhost:4173;
        proxy_http_version 1.1;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Service Worker 不缓存，确保浏览器每次检查更新
    location = /sw.js {
        proxy_pass http://localhost:4173;
        add_header Cache-Control "no-cache";
    }

    # 静态资源缓存（带哈希的文件名可以长期缓存）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        proxy_pass http://localhost:4173;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API Server proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # For image uploads
        client_max_body_size 30m;

        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Compress large JSON responses such as the published card catalog.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1000;
        gzip_types application/json;
    }

    # 壁纸上传包含图片规范化与双布局裁切，给该写入链路独立的处理预算。
    location = /api/player-wallpapers {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 30m;
        proxy_connect_timeout 15s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Image proxy to remote MinIO server
    # Replace MINIO_SERVER_IP with actual MinIO server address
    location ^~ /images/ {
        proxy_pass http://39.105.116.19:9000/loveca-cards/;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

}
